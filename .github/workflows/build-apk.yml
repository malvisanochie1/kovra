name: Build Android APK

# Builds an installable APK on Expo's servers and publishes it as a GitHub Release,
# so every build has a permanent download link.
on: workflow_dispatch

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      - name: Build APK
        working-directory: frontend
        run: eas build --platform android --profile preview --non-interactive --wait --json > "$RUNNER_TEMP/build.json"

      - name: Publish release
        working-directory: frontend
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          URL=$(node -p "require(process.env.RUNNER_TEMP + '/build.json')[0].artifacts.buildUrl")
          ID=$(node -p "require(process.env.RUNNER_TEMP + '/build.json')[0].id")
          VERSION=$(node -p "require('./app.json').expo.version")
          OWNER=$(eas whoami | head -n 1)
          SLUG=$(node -p "require('./app.json').expo.slug")
          PAGE="https://expo.dev/accounts/$OWNER/projects/$SLUG/builds/$ID"
          TAG="apk-v$VERSION-$GITHUB_RUN_NUMBER"

          curl -fsSL "$URL" -o "$RUNNER_TEMP/kovra-$VERSION.apk"
          gh release create "$TAG" "$RUNNER_TEMP/kovra-$VERSION.apk" \
            --title "Kovra $VERSION (build $GITHUB_RUN_NUMBER)" \
            --notes "Android APK for testing. Open on an Android phone to install. Expo build page: $PAGE"

          echo "APK: $URL"
          echo "Page: $PAGE"
          echo "## APK ready" >> "$GITHUB_STEP_SUMMARY"
          echo "- Download: $URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- Release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"

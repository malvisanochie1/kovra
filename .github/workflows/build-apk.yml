name: Build Android APK

# Queues an APK build on Expo's servers, waits for it (the free plan can queue
# for over an hour) and publishes the result as a GitHub Release.
on: workflow_dispatch

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      - name: Queue build
        id: queue
        working-directory: frontend
        run: |
          eas build --platform android --profile preview --non-interactive --no-wait --json > "$RUNNER_TEMP/queued.json"
          echo "id=$(node -p "require(process.env.RUNNER_TEMP + '/queued.json')[0].id")" >> "$GITHUB_OUTPUT"

      - name: Wait and publish release
        working-directory: frontend
        env:
          GH_TOKEN: ${{ github.token }}
        run: ../.github/scripts/publish-apk.sh "${{ steps.queue.outputs.id }}"

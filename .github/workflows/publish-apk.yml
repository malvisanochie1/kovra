name: Publish existing APK build

# Publishes an EAS build that was queued earlier, e.g. from a local `eas build`
# or after an interrupted run. Waits for it to finish if it is still running.
on:
  workflow_dispatch:
    inputs:
      build_id:
        description: EAS build ID
        required: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      # EAS reads the app config, which loads the Expo config plugins from node_modules.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      - name: Wait and publish release
        working-directory: frontend
        env:
          GH_TOKEN: ${{ github.token }}
        run: ../.github/scripts/publish-apk.sh "${{ inputs.build_id }}"
